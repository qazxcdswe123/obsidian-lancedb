name: Build personal search plugin

# Produce reviewable artifacts without publishing a release.
on: workflow_dispatch

permissions:
    contents: read

jobs:
    build:
        runs-on: macos-15
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npm install --global @lancedb/lancedb@latest
            - run: npm run lint
            - run: npm run package:darwin-arm64
            - run: npm run verify:m0
            - run: npm run verify:m1
            - run: npm run verify:m2
            - run: npm run verify:m3
            - run: npm run verify:ann
            - uses: actions/upload-artifact@v4
              with:
                  name: lancedb-search-darwin-arm64
                  path: dist/*-darwin-arm64.zip
                  if-no-files-found: error
